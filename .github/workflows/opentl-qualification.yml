name: OpenTL WTL10 / ATL qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-build:
    name: Windows x64 native GUI/COM and ARM64 PE build
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA256-pinned llvm-mingw 20261020
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          $sha=(Get-FileHash llvm-mingw.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw "Pinned llvm-mingw archive mismatch $sha"
          }
          Expand-Archive llvm-mingw.zip -DestinationPath tools/llvm -Force
          $compiler=Get-ChildItem tools/llvm -Recurse -Filter x86_64-w64-mingw32-clang++.exe |
            Select-Object -First 1
          if (!$compiler) { throw 'Pinned clang++ is missing' }
          "OPENTL_LLVM_BIN=$($compiler.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Exact-pinned OpenATL / official WTL10 checkout (qualification only)
        shell: pwsh
        run: ./scripts/windows-opentl-bootstrap.ps1
      - name: Full WTL10 SDI, native GUI and COM P0-P1D (required)
        shell: pwsh
        run: ./scripts/windows-opentl-accept.ps1 -LLVMRoot $env:OPENTL_LLVM_BIN
      - name: Compile OpenTL CMake interface targets x64 and ARM64 (required)
        shell: pwsh
        run: ./scripts/opentl-cmake-windows.ps1 -LLVMRoot $env:OPENTL_LLVM_BIN
      - name: Upload ARM64 SHA256 provenance handoff
        uses: actions/upload-artifact@v4
        with:
          name: opentl-native-arm64-acceptance
          if-no-files-found: error
          retention-days: 7
          path: |
            build-wtl10/wtl10_gui_runtime_aarch64.exe
            build-wtl10/atl_com_openatl_arm64.exe
            build-wtl10/atl_com_p1_openatl_arm64.exe
            build-wtl10/atl_com_p1b_openatl_arm64.exe
            build-wtl10/atl_registry_sandbox_arm64.exe
            build-wtl10/atl_p1c_registrar_arm64.exe
            build-wtl10/manifest.json

  windows-arm64-native:
    name: Genuine Windows ARM64 GUI/COM P0-P1C runtime
    needs: windows-x64-build
    if: needs.windows-x64-build.result == 'success'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opentl-native-arm64-acceptance
          path: wtl10-arm64
      - name: Verify exact SHA256, ARM64 PE machine and native execution x5
        shell: pwsh
        run: ./scripts/windows-opentl-native-arm64.ps1 -ArtifactRoot 'wtl10-arm64'

  linux-macos-cross:
    name: ${{ matrix.host }} cross-compile Windows x64 and ARM64
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Linux
            runner: ubuntu-24.04
            archive: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
            sha256: 55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335
          - host: macOS
            runner: macos-15
            archive: llvm-mingw-20261020-ucrt-macos-universal.tar.xz
            sha256: e9c13e4ede38e715003ffc674d4d00a1088df8235439d1f0c16188ff0704c17e
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and pin WTL10 / OpenATL / llvm-mingw from this host
        env:
          HOST_LLVM_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/${{ matrix.archive }}
          HOST_LLVM_SHA256: ${{ matrix.sha256 }}
        run: bash scripts/wtl10-cross-host.sh
      - name: Full WTL10 SDI and real Windows .rc PE link
        run: bash scripts/wtl10-full-app-link.sh
      - name: Cross-compile WTL10 native GUI runtime x64 and ARM64
        run: bash scripts/wtl10-gui-cross-host.sh
      - name: Cross-compile OpenATL COM P0-P1C and independent RATL x64 reference
        run: bash scripts/atl-com-cross-host.sh
      - name: CMake OpenTL::ATL / OpenTL::WTL x64 and ARM64 PE targets
        run: bash scripts/opentl-cmake-cross.sh
      # RATL LGPL/GPL x64 test binaries must never be released as OpenTL SDKs.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opentl-cross-${{ matrix.host }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build-wtl10-host/*.dll
            build-wtl10-host/*.exe
            !build-wtl10-host/atl_com_ratl_*.exe
            !build-wtl10-host/atl_com_p1_ratl_*.exe
            !build-wtl10-host/atl_ratl_registry_ref_*.exe
            !build-wtl10-host/ratl_nested_*.exe
            build-wtl10-host/*.res.o
            build-opentl-cmake-*/opentl_gui_runtime.exe
            build-opentl-cmake-*/opentl_com_p0.exe
