name: OpenATL Windows 2025 hardware CET host qualification

on:
  pull_request:
    paths:
      - .github/workflows/openatl-cet-host-qualification.yml
      - tests/wtl10/cet_shadow_stack.cpp
      - tests/wtl10/verify_pe_mitigations.py
      - include/**
  workflow_dispatch:

permissions:
  contents: read

# Do not conflate an absent OS/CPU shadow stack with CETCOMPAT metadata.
# This is an independent, strict host-capability test (not a fallback).
concurrency:
  group: openatl-cet-2025-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-x64-windows-2025-hsp:
    name: Windows 2025 CET host + source-owned thunk and FAST_FAIL
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: MSVC x64 native compiler
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Compile source-owned CET proof and verify PE CFG/CETCOMPAT
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          $os=Get-CimInstance Win32_OperatingSystem
          Write-Host "OPENATL_CET_HOST runner_image=$env:ImageOS runner_version=$env:ImageVersion os_build=$($os.BuildNumber) cpu=$($cpu.Name)"
          $args=@('/nologo','/std:c++17','/O2','/W3','/EHsc','/guard:cf',
                  '/DUNICODE','/D_UNICODE','/D_WIN32_WINNT=0x0A00',
                  '/Iinclude','tests/wtl10/cet_shadow_stack.cpp',
                  '/Fe:openatl_cet_host.exe','/link','/GUARD:CF','/CETCOMPAT',
                  '/DYNAMICBASE','/NXCOMPAT','/INCREMENTAL:NO')
          & cl.exe @args
          if ($LASTEXITCODE -ne 0) { throw "Native CET source compile failed: $LASTEXITCODE" }
          & python tests/wtl10/verify_pe_mitigations.py openatl_cet_host.exe x86_64 --require-cfg --require-cet
          if ($LASTEXITCODE -ne 0) { throw "CET/CFG PE inspection failed: $LASTEXITCODE" }
      - name: Native real hardware HSP x5 (no skip, no fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & .\openatl_cet_host.exe --inventory
          if ($LASTEXITCODE -ne 0) { throw "HSP parent inventory failed: $LASTEXITCODE" }
          for ($i=1; $i -le 5; $i++) {
            & .\openatl_cet_host.exe --require-hardware
            if ($LASTEXITCODE -ne 0) {
              throw "Native hardware CET enforced test $i/5 failed: $LASTEXITCODE"
            }
          }
          Write-Host "OPENATL_CET_2025_HARDWARE_OK runs=5 pe=1 thunk=1 fastfail=0x39"
