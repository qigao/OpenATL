name: OpenATL source-tree native and cross-platform qualification

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep the exact PR HEAD qualified while avoiding obsolete pending
# attempts for earlier commits on that same pull request. Separate PRs
# and manual dispatch refs retain independent job groups.
concurrency:
  group: openatl-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-tree-only:
    name: Source-only and managed WTL policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/source_tree_policy.py
      - run: python3 tests/atl_surface_policy.py
      - run: python3 tests/wtl_dependency_policy.py

  windows-llvm:
    name: llvm-mingw Win32 suite + x64 native + ARM64 PE build
    # Hosted workers do not guarantee hardware HSP (Issue #15). Keep CFG/CET
    # image checks here; use the dedicated hardware workflow for HSP runtime.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: 8ab7be066a1fa2b49522fffcf3d70c419b26a797
          path: tools/vcpkg-cache
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap exact canonical vcpkg (curl-only, no Mono)
        shell: pwsh
        run: |
          python tools/vcpkg-cache/scripts/setup-vcpkg-curl-cache.py tools/vcpkg-cache
          if ($LASTEXITCODE -ne 0) { throw 'pinned vcpkg bootstrap failed' }
      - name: Install pinned WTL10 from the selected vcpkg overlay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=if($IsWindows){Join-Path $env:VCPKG_ROOT 'vcpkg.exe'}else{Join-Path $env:VCPKG_ROOT 'vcpkg'}
          $installed=Join-Path $env:GITHUB_WORKSPACE 'build/wtl-vcpkg-installed'
          $args_=@('install',"--x-manifest-root=$env:GITHUB_WORKSPACE",
                   "--x-install-root=$installed",'--triplet=qigao-wtl10-headers',
                   "--overlay-ports=$env:VCPKG_OVERLAY_PORTS",
                   "--overlay-triplets=$env:VCPKG_OVERLAY_TRIPLETS")
          & $exe @args_
          if ($LASTEXITCODE -ne 0) { throw 'single-provider WTL install failed' }
          $source=Join-Path $installed 'qigao-wtl10-headers/share/wtl/openatl-wtl-source.txt'
          if (!(Test-Path $source)) { throw 'WTL source stamp missing' }
          "OPENATL_WTL_VCPKG_INSTALLED_DIR=$installed" >> $env:GITHUB_ENV
          "OPENATL_WTL_VCPKG_TRIPLET=qigao-wtl10-headers" >> $env:GITHUB_ENV
      - name: Fetch SHA256-pinned llvm-mingw
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          $actual=(Get-FileHash llvm-mingw.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw "llvm-mingw checksum mismatch: $actual"
          }
          Expand-Archive llvm-mingw.zip -DestinationPath tools/llvm -Force
          $compiler=Get-ChildItem tools/llvm -Recurse -Filter x86_64-w64-mingw32-clang++.exe | Select-Object -First 1
          if(!$compiler) { throw 'Missing pinned llvm-mingw compiler' }
          "OPENATL_LLVM_BIN=$($compiler.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Fetch pinned SDI sample
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $sample='63ba6a992cb3d79d56be66cd283f6615c6646b3d'
          Run git @('clone','--quiet','https://github.com/kkhaike/wtltest.git','tools/wtl10-test')
          Run git @('-C','tools/wtl10-test','checkout','--quiet','--detach',$sample)
          if((git -C tools/wtl10-test rev-parse HEAD).Trim() -ne $sample) { throw 'SDI sample SHA mismatch' }
      - name: Build unchanged Win32 official suite and run CTest x5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $env:OPENATL_LLVM_MINGW_BIN=$env:OPENATL_LLVM_BIN
          $sdkRoot=(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $sdkVersion=Get-ChildItem (Join-Path $sdkRoot 'bin') -Directory |
            Where-Object Name -Match '^10\.0\.\d+\.\d+$' |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if(!$sdkVersion) { throw 'A versioned Windows SDK is required for original TOOLBAR/Ribbon resources' }
          $env:OPENATL_WINDOWS_SDK_BIN=Join-Path $sdkVersion.FullName 'x86'
          foreach($tool in @('rc.exe','uicc.exe')) {
            if(!(Test-Path (Join-Path $env:OPENATL_WINDOWS_SDK_BIN $tool))) { throw "Selected SDK is missing $tool" }
          }
          # Subsequent x64/ARM64 job steps run in new PowerShell processes.
          # Persist this exact selected SDK version, including midl.exe,
          # rather than discovering a different SDK or assuming PATH state.
          "OPENATL_WINDOWS_SDK_BIN=$env:OPENATL_WINDOWS_SDK_BIN" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows SDK bin: $env:OPENATL_WINDOWS_SDK_BIN"
          Run cmake @('--preset','llvm-i686','-DOPENATL_BUILD_WTL_UNMODIFIED=ON')
          Run cmake @('--build','--preset','llvm-i686','--parallel','2')
          Run ctest @('--preset','llvm-i686','--repeat','until-fail:5')
      - name: CMake native x64 and cross ARM64, PE/resources, CTest x5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $env:OPENATL_LLVM_MINGW_BIN=$env:OPENATL_LLVM_BIN
          $sample=(Resolve-Path tools/wtl10-test).Path
          $targets=@('openatl_gui_runtime','openatl_atl_core','openatl_atl_path','openatl_unicode','openatl_unicode_utf8','openatl_atl_extensions','openatl_atl_mapping','openatl_atl_image','openatl_thunk_fault','openatl_mitigation_runtime','openatl_unload_runner','openatl_unload_native','openatl_com_client','openatl_com_site','openatl_wtl_unmodified_headers','openatl_com_server_tests','openatl_activex','openatl_wtl10_sdi','openatl_official_guidgen')
          foreach($arch in @('x86_64','aarch64')) {
            $build="build-llvm-$arch"
            Run cmake @('--preset',"llvm-$arch","-DOPENATL_WTL_DEMO_DIR=$sample","-DOPENATL_BUILD_WTL_UNMODIFIED=ON")
            Run cmake @('--build','--preset',"llvm-$arch",'--parallel','2')
            $peCheck=@('tests/wtl10/verify_pe_mitigations.py',"$build/openatl_mitigation_runtime.exe",$arch,'--require-cfg')
            if($arch -eq 'x86_64') { $peCheck+='--require-cet' }
            Run python $peCheck
            if($arch -eq 'x86_64') {
              Run python @('tests/wtl10/verify_pe_mitigations.py',
                "$build/openatl_cet_shadow_stack.exe",$arch,'--require-cfg','--require-cet')
            }
            foreach($name in @('console','dialog','window')) {
              Run python @('tests/wtl10/verify_pe_machine.py',"$build/openatl_ratl_$name.exe",$arch,'--require-resources')
            }
            $manifest=@{}
            foreach($target in $targets) {
              $file="$build/$target.exe"
              $args_=@('tests/wtl10/verify_pe_machine.py',$file,$arch)
              if($target -in @('openatl_gui_runtime','openatl_unicode_utf8','openatl_wtl10_sdi','openatl_official_guidgen','openatl_official_memdlg')) { $args_+='--require-resources' }
              Run python $args_
              $manifest["$target.exe"]=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            foreach($dllName in @('openatl_unload_fixture.dll','openatl_unload_probe.dll','openatl_com_server_fixture.dll')) {
              $dll="$build/$dllName"
              Run python @('tests/wtl10/verify_pe_machine.py',$dll,$arch)
              $manifest[$dllName]=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            if($arch -eq 'x86_64') {
              # Inventory also executes the HSP death test when the parent is
              # protected. Exclude all CET runtime cases on hosted LLVM jobs.
              Run ctest @('--preset',"llvm-$arch",'--repeat','until-fail:5')
            } else {
              $manifest | ConvertTo-Json -Depth 3 | Set-Content "$build/manifest.json" -Encoding utf8
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: openatl-llvm-arm64
          path: |
            build-llvm-aarch64/*.exe
            !build-llvm-aarch64/openatl_ratl_*.exe
            build-llvm-aarch64/*.dll
            build-llvm-aarch64/manifest.json
          if-no-files-found: error
          retention-days: 7

  msvc-win32-official:
    name: MSVC x86 complete official WTL10 suite and native CTest
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: 8ab7be066a1fa2b49522fffcf3d70c419b26a797
          path: tools/vcpkg-cache
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap exact canonical vcpkg (curl-only, no Mono)
        shell: pwsh
        run: |
          python tools/vcpkg-cache/scripts/setup-vcpkg-curl-cache.py tools/vcpkg-cache
          if ($LASTEXITCODE -ne 0) { throw 'pinned vcpkg bootstrap failed' }
      - name: Install pinned WTL10 from the selected vcpkg overlay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=if($IsWindows){Join-Path $env:VCPKG_ROOT 'vcpkg.exe'}else{Join-Path $env:VCPKG_ROOT 'vcpkg'}
          $installed=Join-Path $env:GITHUB_WORKSPACE 'build/wtl-vcpkg-installed'
          $args_=@('install',"--x-manifest-root=$env:GITHUB_WORKSPACE",
                   "--x-install-root=$installed",'--triplet=qigao-wtl10-headers',
                   "--overlay-ports=$env:VCPKG_OVERLAY_PORTS",
                   "--overlay-triplets=$env:VCPKG_OVERLAY_TRIPLETS")
          & $exe @args_
          if ($LASTEXITCODE -ne 0) { throw 'single-provider WTL install failed' }
          $source=Join-Path $installed 'qigao-wtl10-headers/share/wtl/openatl-wtl-source.txt'
          if (!(Test-Path $source)) { throw 'WTL source stamp missing' }
          "OPENATL_WTL_VCPKG_INSTALLED_DIR=$installed" >> $env:GITHUB_ENV
          "OPENATL_WTL_VCPKG_TRIPLET=qigao-wtl10-headers" >> $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x86
      - name: Compile all 11 unchanged official Win32 samples, verify PE resources and run CTest x5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool, [string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          Run cmake @('--preset','msvc-x86','-DOPENATL_BUILD_WTL_UNMODIFIED=ON')
          Run cmake @('--build','--preset','msvc-x86','--parallel','2')
          $samples=@('Aero','Alpha','BmpView','GuidGen','MDIDocVw','MemDlg',
                     'MTPad','MTPad7','TabBrowser','Wizard97Test','WTLExplorer')
          foreach($sample in $samples) {
            $filename="build-msvc-x86/openatl_official_$($sample.ToLowerInvariant()).exe"
            if(!(Test-Path $filename)) { throw "Missing official MSVC Win32 sample: $sample" }
            Run python @('tests/wtl10/verify_pe_machine.py',$filename,'i686','--require-resources')
          }
          Run ctest @('--preset','msvc-x86','--repeat','until-fail:5')

  msvc-windows:
    name: MSVC ${{ matrix.target }} native/build qualification
    # Generic hosted Windows build: hardware HSP is NOT guaranteed by this
    # image. Native CET remains fail-closed until a dedicated HSP-backed
    # runner is provisioned and fully qualified (Issue #15).
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            vc_arch: amd64
          - target: arm64
            vc_arch: amd64_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: 8ab7be066a1fa2b49522fffcf3d70c419b26a797
          path: tools/vcpkg-cache
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap exact canonical vcpkg (curl-only, no Mono)
        shell: pwsh
        run: |
          python tools/vcpkg-cache/scripts/setup-vcpkg-curl-cache.py tools/vcpkg-cache
          if ($LASTEXITCODE -ne 0) { throw 'pinned vcpkg bootstrap failed' }
      - name: Install pinned WTL10 from the selected vcpkg overlay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=if($IsWindows){Join-Path $env:VCPKG_ROOT 'vcpkg.exe'}else{Join-Path $env:VCPKG_ROOT 'vcpkg'}
          $installed=Join-Path $env:GITHUB_WORKSPACE 'build/wtl-vcpkg-installed'
          $args_=@('install',"--x-manifest-root=$env:GITHUB_WORKSPACE",
                   "--x-install-root=$installed",'--triplet=qigao-wtl10-headers',
                   "--overlay-ports=$env:VCPKG_OVERLAY_PORTS",
                   "--overlay-triplets=$env:VCPKG_OVERLAY_TRIPLETS")
          & $exe @args_
          if ($LASTEXITCODE -ne 0) { throw 'single-provider WTL install failed' }
          $source=Join-Path $installed 'qigao-wtl10-headers/share/wtl/openatl-wtl-source.txt'
          if (!(Test-Path $source)) { throw 'WTL source stamp missing' }
          "OPENATL_WTL_VCPKG_INSTALLED_DIR=$installed" >> $env:GITHUB_ENV
          "OPENATL_WTL_VCPKG_TRIPLET=qigao-wtl10-headers" >> $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.vc_arch }}
      - name: Fetch pinned SDI sample
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          if(!(Get-Command cl.exe -ErrorAction SilentlyContinue) -or
             !(Get-Command rc.exe -ErrorAction SilentlyContinue)) { throw 'MSVC and Windows rc.exe required' }
          $sample='63ba6a992cb3d79d56be66cd283f6615c6646b3d'
          Run git @('clone','--quiet','https://github.com/kkhaike/wtltest.git','tools/wtl10-test')
          Run git @('-C','tools/wtl10-test','checkout','--quiet','--detach',$sample)
          if((git -C tools/wtl10-test rev-parse HEAD).Trim() -ne $sample) { throw 'SDI sample SHA mismatch' }
      - name: MSVC source-tree CMake, PE/resources and native CTest x5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $arch='${{ matrix.target }}'
          $machine=if($arch -eq 'x64'){'x86_64'}else{'aarch64'}
          $build="build-msvc-$arch"
          $sample=(Resolve-Path tools/wtl10-test).Path
          $cmakeArgs=@('--preset',"msvc-$arch","-DOPENATL_WTL_DEMO_DIR=$sample","-DOPENATL_BUILD_WTL_UNMODIFIED=ON")
          if($arch -eq 'x64') {
            # GitHub's generic windows-2022 image has no guaranteed hardware
            # Shadow Stack. Preserve strict HSP proof in the dedicated
            # hardware-only workflow; this hosted job qualifies the PE image,
            # UI/COM native behavior and does NOT claim hardware HSP admission.
            $cmakeArgs+='-DOPENATL_REQUIRE_CET_RUNTIME=OFF'
            Write-Host '::notice::Hardware CET/HSP is UNQUALIFIED on generic hosted Windows; strict independent admission requires openatl-hsp-dedicated.yml and a real HSP runner (#15).'
          }
          Run cmake $cmakeArgs
          Run cmake @('--build','--preset',"msvc-$arch",'--parallel','2')
          $peCheck=@('tests/wtl10/verify_pe_mitigations.py',"$build/openatl_mitigation_runtime.exe",$machine,'--require-cfg')
          if($machine -eq 'x86_64') { $peCheck+='--require-cet' }
          Run python $peCheck
          if($machine -eq 'x86_64') {
            Run python @('tests/wtl10/verify_pe_mitigations.py',
              "$build/openatl_cet_shadow_stack.exe",$machine,'--require-cfg','--require-cet')
            Run "$build/openatl_cet_shadow_stack.exe" @('--inventory')
          }
          $identity=Get-ChildItem "$build/CMakeFiles" -Recurse -Filter CMakeCXXCompiler.cmake | Select-Object -First 1
          if(!$identity -or !(Select-String -Path $identity.FullName -Pattern 'CMAKE_CXX_COMPILER_ID "MSVC"' -Quiet)) {
            throw 'MSVC cl.exe was not the actual compiler'
          }
          $targets=@('openatl_gui_runtime','openatl_atl_core','openatl_atl_path','openatl_unicode','openatl_unicode_utf8','openatl_atl_extensions','openatl_atl_mapping','openatl_atl_image','openatl_thunk_fault','openatl_mitigation_runtime','openatl_unload_runner','openatl_unload_native','openatl_com_client','openatl_com_site','openatl_wtl_unmodified_headers','openatl_com_server_tests','openatl_activex','openatl_wtl10_sdi','openatl_official_guidgen','openatl_official_memdlg')
          foreach($name in @('console','dialog','window')) {
            Run python @('tests/wtl10/verify_pe_machine.py',"$build/openatl_ratl_$name.exe",$machine,'--require-resources')
          }
          $manifest=@{}
          foreach($target in $targets) {
            $file="$build/$target.exe"
            $args_=@('tests/wtl10/verify_pe_machine.py',$file,$machine)
            if($target -in @('openatl_gui_runtime','openatl_unicode_utf8','openatl_wtl10_sdi','openatl_official_guidgen','openatl_official_memdlg')) { $args_+='--require-resources' }
            Run python $args_
            $manifest["$target.exe"]=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          foreach($dllName in @('openatl_unload_fixture.dll','openatl_unload_probe.dll','openatl_com_server_fixture.dll')) {
            $dll="$build/$dllName"
            Run python @('tests/wtl10/verify_pe_machine.py',$dll,$machine)
            $manifest[$dllName]=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if($arch -eq 'x64') {
            Run ctest @('--preset',"msvc-$arch",'--repeat','until-fail:5')
          } else {
            $manifest | ConvertTo-Json -Depth 3 | Set-Content "$build/manifest.json" -Encoding utf8
          }
      - name: Published Salts Unicode SDK x64 qualification
        if: matrix.target == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $url='https://github.com/qigao/salts/releases/download/v2.3.0-rc.17/Salts.Native.2.3.0-rc.17.nupkg'
          Run curl.exe @('-fLsS','-o','tools/salts-sdk.zip',$url)
          $hash=(Get-FileHash tools/salts-sdk.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne 'dfda2bb9fbbbbf8b13f8ba941d3b4eb302814fd90da5869c6b22111f322e68c3') {
            throw 'Published Salts SDK checksum mismatch'
          }
          Expand-Archive tools/salts-sdk.zip -DestinationPath tools/salts-sdk
          $env:SALTS_ROOT=(Resolve-Path tools/salts-sdk/sdk/windows-x64).Path.Replace('\','/')
          $env:PATH="$env:SALTS_ROOT/bin;$env:PATH"
          $sample=(Resolve-Path tools/wtl10-test).Path
          Run cmake @('--preset','msvc-salts',"-DOPENATL_WTL_DEMO_DIR=$sample")
          Run cmake @('--build','--preset','msvc-salts','--parallel','2')
          Run ctest @('--preset','msvc-salts','--repeat','until-fail:5')
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'arm64'
        with:
          name: openatl-msvc-arm64
          path: |
            build-msvc-arm64/*.exe
            !build-msvc-arm64/openatl_ratl_*.exe
            build-msvc-arm64/*.dll
            build-msvc-arm64/manifest.json
          if-no-files-found: error
          retention-days: 7

  windows-arm64-llvm:
    name: Real Windows ARM64 llvm-mingw CTest equivalents
    needs: windows-llvm
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openatl-llvm-arm64
          path: llvm-arm64
      - name: Verify SHA256, ARM64 PE, real SDI, CET and unload tests x5
        run: python tests/wtl10/native_arm64.py llvm-arm64 llvm

  windows-arm64-msvc:
    name: Real Windows ARM64 MSVC CTest equivalents
    needs: msvc-windows
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openatl-msvc-arm64
          path: msvc-arm64
      - name: Verify SHA256, ARM64 PE, real SDI, CET and unload tests x5
        run: python tests/wtl10/native_arm64.py msvc-arm64 msvc

  linux-macos-cross:
    name: ${{ matrix.host }} Windows x64/ARM64 cross CMake
    # A macOS runner is currently unavailable. Keep macOS qualification
    # opt-in, NOT silently passing or permanently deleted. Set repository
    # variable OPENATL_MACOS_RUNNER_AVAILABLE=true to schedule the exact same
    # pinned x64/ARM64 Windows cross-build when capacity has been provisioned.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(vars.OPENATL_MACOS_RUNNER_AVAILABLE == 'true' && '[{"host":"Linux","runner":"ubuntu-24.04","archive":"llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz","sha256":"55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335"},{"host":"macOS","runner":"macos-15","archive":"llvm-mingw-20261020-ucrt-macos-universal.tar.xz","sha256":"e9c13e4ede38e715003ffc674d4d00a1088df8235439d1f0c16188ff0704c17e"}]' || '[{"host":"Linux","runner":"ubuntu-24.04","archive":"llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz","sha256":"55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: 8ab7be066a1fa2b49522fffcf3d70c419b26a797
          path: tools/vcpkg-cache
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap exact canonical vcpkg (curl-only, no Mono)
        shell: pwsh
        run: |
          python tools/vcpkg-cache/scripts/setup-vcpkg-curl-cache.py tools/vcpkg-cache
          if ($LASTEXITCODE -ne 0) { throw 'pinned vcpkg bootstrap failed' }
      - name: Install pinned WTL10 from the selected vcpkg overlay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=if($IsWindows){Join-Path $env:VCPKG_ROOT 'vcpkg.exe'}else{Join-Path $env:VCPKG_ROOT 'vcpkg'}
          $installed=Join-Path $env:GITHUB_WORKSPACE 'build/wtl-vcpkg-installed'
          $args_=@('install',"--x-manifest-root=$env:GITHUB_WORKSPACE",
                   "--x-install-root=$installed",'--triplet=qigao-wtl10-headers',
                   "--overlay-ports=$env:VCPKG_OVERLAY_PORTS",
                   "--overlay-triplets=$env:VCPKG_OVERLAY_TRIPLETS")
          & $exe @args_
          if ($LASTEXITCODE -ne 0) { throw 'single-provider WTL install failed' }
          $source=Join-Path $installed 'qigao-wtl10-headers/share/wtl/openatl-wtl-source.txt'
          if (!(Test-Path $source)) { throw 'WTL source stamp missing' }
          "OPENATL_WTL_VCPKG_INSTALLED_DIR=$installed" >> $env:GITHUB_ENV
          "OPENATL_WTL_VCPKG_TRIPLET=qigao-wtl10-headers" >> $env:GITHUB_ENV
      - name: Install SHA256-pinned llvm-mingw
        shell: bash
        env:
          LLVM_ARCHIVE: ${{ matrix.archive }}
          LLVM_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p tools/llvm
          curl -fLsS --retry 3 --retry-delay 3 "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/$LLVM_ARCHIVE" -o llvm.tar.xz
          echo "$LLVM_SHA256  llvm.tar.xz" | shasum -a 256 -c -
          tar -xJf llvm.tar.xz -C tools/llvm
          driver="$(find "$PWD/tools/llvm" -name x86_64-w64-mingw32-clang++ -print -quit)"
          test -x "$driver"
          bin="$(dirname "$driver")"
          echo "OPENATL_LLVM_MINGW_BIN=$bin" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Fetch pinned SDI sample
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$OPENATL_LLVM_MINGW_BIN:$PATH"
          git clone -q https://github.com/kkhaike/wtltest.git tools/wtl10-test
          git -C tools/wtl10-test checkout -q --detach 63ba6a992cb3d79d56be66cd283f6615c6646b3d
          test "$(git -C tools/wtl10-test rev-parse HEAD)" = 63ba6a992cb3d79d56be66cd283f6615c6646b3d
      - name: CMake/WTL SDI and Windows PE resource qualification for both RIDs
        shell: bash
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            build="build-llvm-$arch"
            cmake --preset "llvm-$arch" "-DOPENATL_WTL_DEMO_DIR=$PWD/tools/wtl10-test" "-DOPENATL_BUILD_WTL_UNMODIFIED=ON"
            cmake --build --preset "llvm-$arch" --parallel 2
            if [ "$arch" = x86_64 ]; then
              python3 tests/wtl10/verify_pe_mitigations.py "$build/openatl_mitigation_runtime.exe" "$arch" --require-cfg --require-cet
              python3 tests/wtl10/verify_pe_mitigations.py "$build/openatl_cet_shadow_stack.exe" "$arch" --require-cfg --require-cet
            else
              python3 tests/wtl10/verify_pe_mitigations.py "$build/openatl_mitigation_runtime.exe" "$arch" --require-cfg
            fi
            for target in openatl_gui_runtime openatl_atl_core openatl_atl_path openatl_unicode openatl_unicode_utf8 openatl_atl_extensions openatl_atl_mapping openatl_atl_image openatl_thunk_fault openatl_mitigation_runtime openatl_unload_runner openatl_unload_native openatl_com_client openatl_com_site openatl_wtl_unmodified_headers openatl_com_server_tests openatl_activex openatl_wtl10_sdi openatl_official_guidgen openatl_ratl_console openatl_ratl_dialog openatl_ratl_window; do
              if [ "$target" = openatl_gui_runtime ] || [ "$target" = openatl_unicode_utf8 ] || [ "$target" = openatl_wtl10_sdi ] || [ "$target" = openatl_official_guidgen ] || [[ "$target" == openatl_ratl_* ]]; then
                python3 tests/wtl10/verify_pe_machine.py "$build/$target.exe" "$arch" --require-resources
              else
                python3 tests/wtl10/verify_pe_machine.py "$build/$target.exe" "$arch"
              fi
            done
            python3 tests/wtl10/verify_pe_machine.py "$build/openatl_unload_fixture.dll" "$arch"
            python3 tests/wtl10/verify_pe_machine.py "$build/openatl_unload_probe.dll" "$arch"
            python3 tests/wtl10/verify_pe_machine.py "$build/openatl_com_server_fixture.dll" "$arch"
          done
