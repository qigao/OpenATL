name: OpenWTL Windows x64/ARM64 native MSVC and llvm-mingw

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# pull_request GITHUB_SHA names GitHub's synthetic merge, not the PR HEAD.
# Every builder and real ARM64 consumer checks out and verifies this same SHA.
env:
  OPENATL_EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# Keep the exact PR HEAD qualified while avoiding obsolete pending
# attempts for earlier commits on that same pull request. Separate PRs
# and manual dispatch refs retain independent job groups.
concurrency:
  group: openatl-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-tree-only:
    name: Source-only ATL backend and repository WTL policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 tests/source_tree_policy.py
      - run: python3 tests/atl_surface_policy.py
      - run: python3 tests/wtl_dependency_policy.py
      - run: python3 tests/wtl10/test_manifest_contract.py

  windows-llvm:
    needs: source-tree-only
    name: llvm-mingw x64 native + ARM64 PE and native qualification
    # Hosted workers do not guarantee hardware HSP (Issue #15). Keep CFG/CET
    # image checks here; use the dedicated hardware workflow for HSP runtime.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch SHA256-pinned llvm-mingw
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          $actual=(Get-FileHash llvm-mingw.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw "llvm-mingw checksum mismatch: $actual"
          }
          Expand-Archive llvm-mingw.zip -DestinationPath tools/llvm -Force
          $compiler=Get-ChildItem tools/llvm -Recurse -Filter x86_64-w64-mingw32-clang++.exe | Select-Object -First 1
          if(!$compiler) { throw 'Missing pinned llvm-mingw compiler' }
          "OPENATL_LLVM_BIN=$($compiler.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Fetch pinned SDI sample
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $sample='63ba6a992cb3d79d56be66cd283f6615c6646b3d'
          Run git @('clone','--quiet','https://github.com/kkhaike/wtltest.git','tools/wtl10-test')
          Run git @('-C','tools/wtl10-test','checkout','--quiet','--detach',$sample)
          if((git -C tools/wtl10-test rev-parse HEAD).Trim() -ne $sample) { throw 'SDI sample SHA mismatch' }
      - name: Select pinned Windows SDK host RC/UICC for x64/ARM64 resources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $env:OPENATL_LLVM_MINGW_BIN=$env:OPENATL_LLVM_BIN
          $sdkRoot=(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $sdkVersion=Get-ChildItem (Join-Path $sdkRoot 'bin') -Directory |
            Where-Object Name -Match '^10\.0\.\d+\.\d+$' |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if(!$sdkVersion) { throw 'A versioned Windows SDK is required for original TOOLBAR/Ribbon resources' }
          $env:OPENATL_WINDOWS_SDK_BIN=Join-Path $sdkVersion.FullName 'x86'
          foreach($tool in @('rc.exe','uicc.exe')) {
            if(!(Test-Path (Join-Path $env:OPENATL_WINDOWS_SDK_BIN $tool))) { throw "Selected SDK is missing $tool" }
          }
          # The SDK's host resource executables do not compile an x86 target.
          # Persist this exact selected SDK version, including midl.exe,
          # rather than discovering a different SDK or assuming PATH state.
          "OPENATL_WINDOWS_SDK_BIN=$env:OPENATL_WINDOWS_SDK_BIN" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows SDK bin: $env:OPENATL_WINDOWS_SDK_BIN"
      - name: CMake native x64 and cross ARM64, PE/resources, CTest x5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $env:OPENATL_LLVM_MINGW_BIN=$env:OPENATL_LLVM_BIN
          $sample=(Resolve-Path tools/wtl10-test).Path
          $targets=@('openatl_gui_runtime','openatl_atl_core','openatl_atl_path','openatl_unicode','openatl_unicode_utf8','openatl_atl_extensions','openatl_atl_mapping','openatl_atl_image','openatl_thunk_fault','openatl_mitigation_runtime','openatl_unload_runner','openatl_unload_native','openatl_com_client','openatl_com_site','openatl_wtl_unmodified_headers','openatl_com_server_tests','openatl_activex','openatl_wtl10_sdi','openatl_official_guidgen')
          foreach($arch in @('x86_64','aarch64')) {
            $build="build-llvm-$arch"
            Run cmake @('--preset',"llvm-$arch","-DOPENATL_WTL_DEMO_DIR=$sample","-DOPENATL_BUILD_WTL_UNMODIFIED=ON")
            Run cmake @('--build','--preset',"llvm-$arch",'--parallel','2')
            $peCheck=@('tests/wtl10/verify_pe_mitigations.py',"$build/openatl_mitigation_runtime.exe",$arch,'--require-cfg')
            if($arch -eq 'x86_64') { $peCheck+='--require-cet' }
            Run python $peCheck
            if($arch -eq 'x86_64') {
              Run python @('tests/wtl10/verify_pe_mitigations.py',
                "$build/openatl_cet_shadow_stack.exe",$arch,'--require-cfg','--require-cet')
            }
            foreach($name in @('console','dialog','window')) {
              Run python @('tests/wtl10/verify_pe_machine.py',"$build/openatl_ratl_$name.exe",$arch,'--require-resources')
            }
            $manifest=@{}
            foreach($target in $targets) {
              $file="$build/$target.exe"
              $args_=@('tests/wtl10/verify_pe_machine.py',$file,$arch)
              if($target -in @('openatl_gui_runtime','openatl_unicode_utf8','openatl_wtl10_sdi','openatl_official_guidgen','openatl_official_memdlg')) { $args_+='--require-resources' }
              Run python $args_
              $manifest["$target.exe"]=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            foreach($dllName in @('openatl_unload_fixture.dll','openatl_unload_probe.dll','openatl_com_server_fixture.dll')) {
              $dll="$build/$dllName"
              Run python @('tests/wtl10/verify_pe_machine.py',$dll,$arch)
              $manifest[$dllName]=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            if($arch -eq 'x86_64') {
              # Inventory also executes the HSP death test when the parent is
              # protected. Exclude all CET runtime cases on hosted LLVM jobs.
              Run ctest @('--preset',"llvm-$arch",'--repeat','until-fail:5')
            } else {
              $manifest | ConvertTo-Json -Depth 3 | Set-Content "$build/manifest.json" -Encoding utf8
            }
          }
      - name: Full original WTL10 on llvm-mingw x64 — source-only headers, CTest x5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $env:OPENATL_LLVM_MINGW_BIN=$env:OPENATL_LLVM_BIN
          # Reconfigure the separately qualified x64 build, without altering
          # the ARM64 artifact and exact PE/SHA256 provenance already staged.
          Run cmake @('--preset','llvm-x86_64',
                      '-DOPENATL_WTL_FULL_ORIGINAL=ON',
                      '-DOPENATL_BUILD_WTL_UNMODIFIED=ON')
          Run cmake @('--build','--preset','llvm-x86_64','--parallel','2')
          Run ctest @('--preset','llvm-x86_64','--repeat','until-fail:5')
          Write-Host 'OPENATL_WTL_FULL_ORIGINAL_LLVM_X64_OK original=1 adapter=0 native=1 repeats=5'
      - uses: actions/upload-artifact@v4
        with:
          name: openatl-llvm-arm64
          path: |
            build-llvm-aarch64/*.exe
            !build-llvm-aarch64/openatl_ratl_*.exe
            build-llvm-aarch64/*.dll
            build-llvm-aarch64/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Compile independent zero-adapter WTL10 llvm-mingw ARM64 and PE manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $env:OPENATL_LLVM_MINGW_BIN=$env:OPENATL_LLVM_BIN
          $demo=(Resolve-Path tools/wtl10-test).Path
          Run cmake @('--preset','llvm-aarch64',
                      '-B','build-llvm-aarch64-original',
                      "-DOPENATL_WTL_DEMO_DIR=$demo",
                      '-DOPENATL_WTL_FULL_ORIGINAL=ON',
                      '-DOPENATL_BUILD_WTL_UNMODIFIED=ON')
          Run cmake @('--build','build-llvm-aarch64-original','--parallel','2')
          Run python @('tests/wtl10/original_arm64_manifest.py',
                      'build-llvm-aarch64-original','llvm')
      - uses: actions/upload-artifact@v4
        with:
          name: openatl-llvm-arm64-original
          path: |
            build-llvm-aarch64-original/*.exe
            !build-llvm-aarch64-original/openatl_ratl_*.exe
            build-llvm-aarch64-original/*.dll
            build-llvm-aarch64-original/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Original WTL LLVM ARM64 qualification artifact created
        shell: pwsh
        run: Write-Host 'OPENATL_WTL_ORIGINAL_ARM64_LLVM_BUILD_OK source=repo adapter=0 manifest=1'

  msvc-windows:
    needs: source-tree-only
    name: MSVC ${{ matrix.target }} native/build qualification
    # Generic hosted Windows build: hardware HSP is NOT guaranteed by this
    # image. Native CET remains fail-closed until a dedicated HSP-backed
    # runner is provisioned and fully qualified (Issue #15).
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            vc_arch: amd64
          - target: arm64
            vc_arch: amd64_arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit original WTL10 registry/property and hyperlink APIs
        if: matrix.target == 'x64'
        shell: pwsh
        run: |
          python tests/wtl_unmodified/audit_wtl_api.py
          if ($LASTEXITCODE -ne 0) { throw 'Original WTL registry API surface changed' }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.vc_arch }}
      - name: Fetch pinned SDI sample
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          if(!(Get-Command cl.exe -ErrorAction SilentlyContinue) -or
             !(Get-Command rc.exe -ErrorAction SilentlyContinue)) { throw 'MSVC and Windows rc.exe required' }
          $sample='63ba6a992cb3d79d56be66cd283f6615c6646b3d'
          Run git @('clone','--quiet','https://github.com/kkhaike/wtltest.git','tools/wtl10-test')
          Run git @('-C','tools/wtl10-test','checkout','--quiet','--detach',$sample)
          if((git -C tools/wtl10-test rev-parse HEAD).Trim() -ne $sample) { throw 'SDI sample SHA mismatch' }
      - name: MSVC source-tree CMake, PE/resources and native CTest x5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $arch='${{ matrix.target }}'
          $machine=if($arch -eq 'x64'){'x86_64'}else{'aarch64'}
          $build="build-msvc-$arch"
          $sample=(Resolve-Path tools/wtl10-test).Path
          $cmakeArgs=@('--preset',"msvc-$arch","-DOPENATL_WTL_DEMO_DIR=$sample","-DOPENATL_BUILD_WTL_UNMODIFIED=ON")
          if($arch -eq 'x64') {
            # GitHub's generic windows-2022 image has no guaranteed hardware
            # Shadow Stack. Preserve strict HSP proof in the dedicated
            # hardware-only workflow; this hosted job qualifies the PE image,
            # UI/COM native behavior and does NOT claim hardware HSP admission.
            $cmakeArgs+='-DOPENATL_REQUIRE_CET_RUNTIME=OFF'
            Write-Host '::notice::Hardware CET/HSP is UNQUALIFIED on generic hosted Windows; strict independent admission requires openatl-hsp-dedicated.yml and a real HSP runner (#15).'
          }
          Run cmake $cmakeArgs
          Run cmake @('--build','--preset',"msvc-$arch",'--parallel','2')
          $peCheck=@('tests/wtl10/verify_pe_mitigations.py',"$build/openatl_mitigation_runtime.exe",$machine,'--require-cfg')
          if($machine -eq 'x86_64') { $peCheck+='--require-cet' }
          Run python $peCheck
          if($machine -eq 'x86_64') {
            Run python @('tests/wtl10/verify_pe_mitigations.py',
              "$build/openatl_cet_shadow_stack.exe",$machine,'--require-cfg','--require-cet')
            Run "$build/openatl_cet_shadow_stack.exe" @('--inventory')
          }
          $identity=Get-ChildItem "$build/CMakeFiles" -Recurse -Filter CMakeCXXCompiler.cmake | Select-Object -First 1
          if(!$identity -or !(Select-String -Path $identity.FullName -Pattern 'CMAKE_CXX_COMPILER_ID "MSVC"' -Quiet)) {
            throw 'MSVC cl.exe was not the actual compiler'
          }
          $targets=@('openatl_gui_runtime','openatl_atl_core','openatl_atl_path','openatl_unicode','openatl_unicode_utf8','openatl_atl_extensions','openatl_atl_mapping','openatl_atl_image','openatl_thunk_fault','openatl_mitigation_runtime','openatl_unload_runner','openatl_unload_native','openatl_com_client','openatl_com_site','openatl_wtl_unmodified_headers','openatl_com_server_tests','openatl_activex','openatl_wtl10_sdi','openatl_official_guidgen','openatl_official_memdlg')
          foreach($name in @('console','dialog','window')) {
            Run python @('tests/wtl10/verify_pe_machine.py',"$build/openatl_ratl_$name.exe",$machine,'--require-resources')
          }
          $manifest=@{}
          foreach($target in $targets) {
            $file="$build/$target.exe"
            $args_=@('tests/wtl10/verify_pe_machine.py',$file,$machine)
            if($target -in @('openatl_gui_runtime','openatl_unicode_utf8','openatl_wtl10_sdi','openatl_official_guidgen','openatl_official_memdlg')) { $args_+='--require-resources' }
            Run python $args_
            $manifest["$target.exe"]=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          foreach($dllName in @('openatl_unload_fixture.dll','openatl_unload_probe.dll','openatl_com_server_fixture.dll')) {
            $dll="$build/$dllName"
            Run python @('tests/wtl10/verify_pe_machine.py',$dll,$machine)
            $manifest[$dllName]=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if($arch -eq 'x64') {
            Run ctest @('--preset',"msvc-$arch",'--repeat','until-fail:5')
          } else {
            $manifest | ConvertTo-Json -Depth 3 | Set-Content "$build/manifest.json" -Encoding utf8
          }
      - name: Full original WTL10 on MSVC x64 — source-only headers, CTest x5
        if: matrix.target == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          # The shared msvc-x64 preset intentionally defaults to mandatory
          # hardware HSP=ON for the separately qualified dedicated runner.
          # Every hosted reconfigure MUST override it: otherwise this second
          # CMake invocation re-enables CET HSP on a runner that has no HSP.
          Run cmake @('--preset','msvc-x64',
                      '-DOPENATL_WTL_FULL_ORIGINAL=ON',
                      '-DOPENATL_BUILD_WTL_UNMODIFIED=ON',
                      '-DOPENATL_REQUIRE_CET_RUNTIME=OFF')
          $cache=Get-Content 'build-msvc-x64/CMakeCache.txt'
          if ($cache -notcontains 'OPENATL_REQUIRE_CET_RUNTIME:BOOL=OFF') {
            throw 'Hosted WTL x64 reconfigure unexpectedly enabled mandatory HSP'
          }
          Write-Host '::notice::Hosted Windows x64 HSP remains UNQUALIFIED; openatl-hsp-dedicated.yml requires real HSP x10, no fallback.'
          Run cmake @('--build','--preset','msvc-x64','--parallel','2')
          Run ctest @('--preset','msvc-x64','--repeat','until-fail:5')
          Write-Host 'OPENATL_WTL_FULL_ORIGINAL_MSVC_X64_OK original=1 adapter=0 native=1 repeats=5 hsp=UNQUALIFIED'
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'arm64'
        with:
          name: openatl-msvc-arm64
          path: |
            build-msvc-arm64/*.exe
            !build-msvc-arm64/openatl_ratl_*.exe
            build-msvc-arm64/*.dll
            build-msvc-arm64/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Compile independent zero-adapter WTL10 MSVC ARM64 and PE manifest
        if: matrix.target == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool,[string[]]$argv) {
            & $tool @argv
            if($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $demo=(Resolve-Path tools/wtl10-test).Path
          Run cmake @('--preset','msvc-arm64',
                      '-B','build-msvc-arm64-original',
                      "-DOPENATL_WTL_DEMO_DIR=$demo",
                      '-DOPENATL_WTL_FULL_ORIGINAL=ON',
                      '-DOPENATL_BUILD_WTL_UNMODIFIED=ON')
          Run cmake @('--build','build-msvc-arm64-original','--parallel','2')
          Run python @('tests/wtl10/original_arm64_manifest.py',
                      'build-msvc-arm64-original','msvc')
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'arm64'
        with:
          name: openatl-msvc-arm64-original
          path: |
            build-msvc-arm64-original/*.exe
            !build-msvc-arm64-original/openatl_ratl_*.exe
            build-msvc-arm64-original/*.dll
            build-msvc-arm64-original/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Original WTL MSVC ARM64 qualification artifact created
        if: matrix.target == 'arm64'
        shell: pwsh
        run: Write-Host 'OPENATL_WTL_ORIGINAL_ARM64_MSVC_BUILD_OK source=repo adapter=0 manifest=1'

  windows-arm64-llvm:
    name: Real Windows ARM64 llvm-mingw CTest equivalents
    needs: windows-llvm
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: openatl-llvm-arm64
          path: llvm-arm64
      - name: Verify SHA256, ARM64 PE, real SDI, CET and unload tests x5
        run: python tests/wtl10/native_arm64.py llvm-arm64 llvm
      - uses: actions/download-artifact@v4
        with:
          name: openatl-llvm-arm64-original
          path: llvm-arm64-original
      - name: Native ARM64 WTL10 full-original llvm-mingw CTest equivalents x5
        run: python tests/wtl10/native_arm64.py llvm-arm64-original llvm

  windows-arm64-msvc:
    name: Real Windows ARM64 MSVC CTest equivalents
    needs: msvc-windows
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: openatl-msvc-arm64
          path: msvc-arm64
      - name: Verify SHA256, ARM64 PE, real SDI, CET and unload tests x5
        run: python tests/wtl10/native_arm64.py msvc-arm64 msvc
      - uses: actions/download-artifact@v4
        with:
          name: openatl-msvc-arm64-original
          path: msvc-arm64-original
      - name: Native ARM64 WTL10 full-original MSVC CTest equivalents x5
        run: python tests/wtl10/native_arm64.py msvc-arm64-original msvc

