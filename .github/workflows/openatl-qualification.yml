name: OpenATL WTL10 UI (no COM) and optional COM client

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-build:
    name: Windows x64 UI no-COM + COM client and ARM64 PE
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA256-pinned llvm-mingw 20261020
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          $sha=(Get-FileHash llvm-mingw.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw "Pinned llvm-mingw archive mismatch $sha"
          }
          Expand-Archive llvm-mingw.zip -DestinationPath tools/llvm -Force
          $compiler=Get-ChildItem tools/llvm -Recurse -Filter x86_64-w64-mingw32-clang++.exe |
            Select-Object -First 1
          if (!$compiler) { throw 'Pinned clang++ is missing' }
          "OPENATL_LLVM_BIN=$($compiler.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Exact-pinned OpenATL / official WTL10 checkout (qualification only)
        shell: pwsh
        run: ./scripts/windows-openatl-bootstrap.ps1
      - name: Full WTL10 SDI, native UI no-COM and COM client (required)
        shell: pwsh
        run: ./scripts/windows-openatl-accept.ps1 -LLVMRoot $env:OPENATL_LLVM_BIN
      - name: Compile OpenATL CMake interface targets x64 and ARM64 (required)
        shell: pwsh
        run: ./scripts/openatl-cmake-windows.ps1 -LLVMRoot $env:OPENATL_LLVM_BIN
      - name: Upload GUI + client ARM64 SHA256 provenance
        uses: actions/upload-artifact@v4
        with:
          name: openatl-native-arm64-acceptance
          if-no-files-found: error
          retention-days: 7
          path: |
            build-wtl10/wtl10_gui_runtime_aarch64.exe
            build-wtl10/atl_com_client_arm64.exe
            build-wtl10/manifest.json

  windows-arm64-native:
    name: Genuine Windows ARM64 UI no-COM and COM Client
    needs: windows-x64-build
    if: needs.windows-x64-build.result == 'success'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openatl-native-arm64-acceptance
          path: wtl10-arm64
      - name: Verify exact SHA256, ARM64 PE machine and native execution x5
        shell: pwsh
        run: ./scripts/windows-openatl-native-arm64.ps1 -ArtifactRoot 'wtl10-arm64'

  msvc-windows:
    name: MSVC cl.exe Windows ${{ matrix.target }} UI and COM Client
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            vc_arch: amd64
          - target: arm64
            vc_arch: amd64_arm64
    steps:
      - uses: actions/checkout@v4
      # Pin the developer environment action to an immutable commit.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.vc_arch }}
      - name: Verify native MSVC and Microsoft Windows SDK tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $compiler=(Get-Command cl.exe -ErrorAction Stop).Source
          $resource=(Get-Command rc.exe -ErrorAction Stop).Source
          if (!$compiler.ToLowerInvariant().EndsWith('cl.exe') -or
              !$resource.ToLowerInvariant().EndsWith('rc.exe')) {
            throw "Missing MSVC compiler or Windows SDK resource compiler"
          }
          Write-Host "MSVC compiler: $compiler; rc: $resource"
      - name: Fetch exact-pinned OpenATL and WTL10 (NEVER Microsoft ATL)
        shell: pwsh
        run: ./scripts/windows-openatl-bootstrap.ps1
      - name: MSVC compile and native/PE conformance (required)
        shell: pwsh
        run: ./scripts/windows-msvc-qualification.ps1 -TargetArchitecture '${{ matrix.target }}'
      - name: Upload exact MSVC ARM64 PE and SHA256 for native ARM64 execution
        if: matrix.target == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: openatl-msvc-arm64-acceptance
          retention-days: 7
          if-no-files-found: error
          path: |
            build-msvc-arm64/openatl_gui_runtime.exe
            build-msvc-arm64/openatl_com_client.exe
            build-msvc-arm64/openatl_wtl10_sdi.exe
            build-msvc-arm64/manifest-msvc-arm64.json

  msvc-arm64-native:
    name: MSVC genuine Windows ARM64 UI no-COM and COM Client
    needs: msvc-windows
    if: needs.msvc-windows.result == 'success'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openatl-msvc-arm64-acceptance
          path: msvc-arm64
      - name: Verify MSVC PE machine/SHA256 and native GUI+COM 5 times
        shell: pwsh
        run: ./scripts/windows-msvc-native-arm64.ps1 -ArtifactRoot 'msvc-arm64'

  linux-macos-cross:
    name: ${{ matrix.host }} cross-compile Windows x64 and ARM64
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Linux
            runner: ubuntu-24.04
            archive: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
            sha256: 55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335
          - host: macOS
            runner: macos-15
            archive: llvm-mingw-20261020-ucrt-macos-universal.tar.xz
            sha256: e9c13e4ede38e715003ffc674d4d00a1088df8235439d1f0c16188ff0704c17e
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and pin WTL10 / OpenATL / llvm-mingw from this host
        env:
          HOST_LLVM_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/${{ matrix.archive }}
          HOST_LLVM_SHA256: ${{ matrix.sha256 }}
        run: bash scripts/wtl10-cross-host.sh
      - name: Full WTL10 SDI and real Windows .rc PE link
        run: bash scripts/wtl10-full-app-link.sh
      - name: Cross-compile WTL10 UI without COM apartment x64 and ARM64
        run: bash scripts/wtl10-gui-cross-host.sh
      - name: Cross-compile optional OpenATL COM Client x64 and ARM64
        run: bash scripts/atl-com-client-cross-host.sh
      - name: CMake OpenATL::ATL / OpenATL::WTL x64 and ARM64 PE targets
        run: bash scripts/openatl-cmake-cross.sh
      # Cross-build Windows UI and COM-client PE only; no server or RATL artifacts.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openatl-cross-${{ matrix.host }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build-wtl10-host/*.dll
            build-wtl10-host/*.exe
            build-wtl10-host/*.res.o
            build-openatl-cmake-*/openatl_gui_runtime.exe
            build-openatl-cmake-*/openatl_com_client.exe
