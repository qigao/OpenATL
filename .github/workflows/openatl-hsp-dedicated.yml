name: OpenATL trusted Windows x64 hardware CET admission

# Manual only: never execute unreviewed public PR code on a self-hosted runner.
# Requires a Windows x64 host whose real HSP capability was independently
# established BEFORE it received the openatl-cet-hsp runner label.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-hsp:
    name: Dedicated Windows x64 MSVC and llvm-mingw CET HSP x10
    runs-on: [self-hosted, windows, x64, openatl-cet-hsp]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: MSVC x64 native toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: MSVC x64 source-owned CET HSP death test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool, [string[]]$argv) {
            & $tool @argv
            if ($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          $os=Get-CimInstance Win32_OperatingSystem
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          Write-Host "OPENATL_CONTROLLED_CET_HOST os_build=$($os.BuildNumber) cpu=$($cpu.Name)"
          Run cl.exe @('/nologo','/std:c++17','/O2','/W3','/EHsc','/guard:cf',
              '/DUNICODE','/D_UNICODE','/D_WIN32_WINNT=0x0A00',
              '/Iinclude','tests/wtl10/cet_shadow_stack.cpp',
              '/Fe:openatl_cet_msvc.exe','/link','/GUARD:CF','/CETCOMPAT',
              '/DYNAMICBASE','/NXCOMPAT','/INCREMENTAL:NO')
          Run python @('tests/wtl10/verify_pe_mitigations.py',
              'openatl_cet_msvc.exe','x86_64','--require-cfg','--require-cet')
          Run '.\openatl_cet_msvc.exe' @('--inventory')
          for ($i=1; $i -le 10; $i++) {
            Run '.\openatl_cet_msvc.exe' @('--require-hardware')
          }
          Write-Host "OPENATL_CONTROLLED_CET_MSVC_OK repeats=10 fastfail=0x39"
      - name: Fetch SHA256-pinned llvm-mingw with curl
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          & curl.exe -fLsS -o llvm-mingw.zip $url
          if ($LASTEXITCODE -ne 0) { throw "Pinned llvm-mingw download failed" }
          $actual=(Get-FileHash llvm-mingw.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw "Pinned llvm-mingw SHA256 mismatch: $actual"
          }
          Expand-Archive llvm-mingw.zip -DestinationPath tools/llvm -Force
          $compiler=Get-ChildItem tools/llvm -Recurse -Filter x86_64-w64-mingw32-clang++.exe |
            Select-Object -First 1
          if (!$compiler) { throw "Pinned compiler not found" }
          "OPENATL_LLVM_CXX=$($compiler.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: llvm-mingw x64 source-owned CET HSP death test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Run([string]$tool, [string[]]$argv) {
            & $tool @argv
            if ($LASTEXITCODE -ne 0) { throw "$tool failed: exit $LASTEXITCODE" }
          }
          Run $env:OPENATL_LLVM_CXX @('-std=c++17','-O2','-static',
              '-Xclang','-cfguard','-fno-omit-frame-pointer',
              '-fno-optimize-sibling-calls','-DUNICODE','-D_UNICODE',
              '-D_WIN32_WINNT=0x0A00','-Iinclude',
              'tests/wtl10/cet_shadow_stack.cpp','-o','openatl_cet_llvm.exe',
              '-Wl,-Xlink,-guard:cf','-Wl,-Xlink,-cetcompat')
          Run python @('tests/wtl10/verify_pe_mitigations.py',
              'openatl_cet_llvm.exe','x86_64','--require-cfg','--require-cet')
          Run '.\openatl_cet_llvm.exe' @('--inventory')
          for ($i=1; $i -le 10; $i++) {
            Run '.\openatl_cet_llvm.exe' @('--require-hardware')
          }
          Write-Host "OPENATL_CONTROLLED_CET_LLVM_OK repeats=10 fastfail=0x39"
